[project]
name = "entirius-django-sitemap"
version = "4.0.1"
description = "Django app to create multilingual sitemaps for PWA with ContentDB and FAQ support"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.0.0",
    "tqdm>=4.65.0",
    "pytz>=2023.3",
    "entirius-py-process-logger>=2.0.0",
    "entirius-django-regional>=2.0.1",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = [
    "pytest",
    "pytest-django",
    "dj-database-url",
    "psycopg[binary]",
]
# Soft integrations: generators degrade gracefully (skip + log) when the app is absent.
pim       = ["entirius-django-pim>=3.0.0"]
contentdb = ["entirius-django-contentdb>=5.0.0"]
faq       = ["entirius-django-faq>=2.0.0"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-sitemap"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_sitemap"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# S314: stdlib XML parse of self-generated sitemap output in assertions.
"tests/**" = ["S101", "S105", "S106", "S314"]
# Legacy migrated 1:1
"src/django_sitemap/admin.py" = ["DJ007"]
"src/django_sitemap/management/**" = ["C419"]
"src/django_sitemap/models/**" = ["DJ001", "F401"]
# F401: soft-import probes (package presence detection side effect).
"src/django_sitemap/settings.py" = ["F401"]
# S318: stdlib XML minidom on self-generated sitemap files — no untrusted input.
"src/django_sitemap/worker/**" = ["B007", "C416", "S318"]

[tool.ruff.lint.isort]
known-first-party = ["django_sitemap"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# Legacy pre-rename package name probed in the settings.py soft-import fallback chain.
DEP001 = ["contentdb"]
# Schema-only dependency: DomainSitemap M2M targets django_regional.Language (no Python import).
DEP002 = ["entirius-django-regional"]
